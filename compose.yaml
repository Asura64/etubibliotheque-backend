services:
  mysql:
    image: 'mysql:latest'
    environment:
      - 'MYSQL_DATABASE=${DB_NAME}'
      - 'MYSQL_USER=${DB_USER}'
      - 'MYSQL_PASSWORD=${DB_PASSWORD}'
      - 'MYSQL_ROOT_PASSWORD=root_password'
    ports:
      - '3306'
    volumes:
      - db_data:/var/lib/mysql
  phpmyadmin:
    image: 'phpmyadmin:latest'
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
    ports:
      - '8585:80'
volumes:
  db_data: