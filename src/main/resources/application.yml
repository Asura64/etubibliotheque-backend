spring:
  application:
    name: etudiant-backend
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}

logging:
  level:
    org:
      hibernate:
        type: info
      springframework:
        web:
          filter:
            CommonsRequestLoggingFilter: info
    com:
      openclassrooms:
        etudiant: info

management:
  endpoints:
    web:
      exposure:
        include: '*'

security:
  jwt:
    # generated with https://www.devglan.com/online-tools/hmac-sha256-online
    secret-key: 4fadddd74a7a63c9a412d0fa7a9259204e9d404c37ac5a94319f8659e19c330b
    # 1h in millisecond
    expiration-time: 3600000